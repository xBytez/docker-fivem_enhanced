name: Update and publish Enhanced image

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: fivem-enhanced
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_IMAGE: docker.io/xbytez/fivem-enhanced
      GHCR_IMAGE: ghcr.io/xbytez/fivem-enhanced
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Find the latest Enhanced Linux build
        id: release
        run: ./scripts/update-enhanced-build.sh

      - name: Commit updated artifact metadata
        if: steps.release.outputs.changed == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Dockerfile
          git commit -m "Update FiveM Enhanced to build ${{ steps.release.outputs.build }} [skip ci]"
          git push

      - name: Decide whether the images need rebuilding
        id: gate
        env:
          NEW_BUILD: ${{ steps.release.outputs.changed }}
          EVENT: ${{ github.event_name }}
          BUILD: ${{ steps.release.outputs.build }}
          REF: ${{ github.ref_name }}
        run: |
          if [ "$NEW_BUILD" = "true" ]; then
            rebuild=true
            reason="new Enhanced build $BUILD"
          elif [ "$EVENT" = "push" ]; then
            rebuild=true
            reason="commits pushed to $REF"
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            rebuild=true
            reason="manual run"
          else
            rebuild=false
            reason="already on Enhanced build $BUILD and no new commits"
          fi
          echo "rebuild=$rebuild" >> "$GITHUB_OUTPUT"
          if [ "$rebuild" = "true" ]; then
            echo "Rebuilding: $reason" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Skipping build and push: $reason" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Docker Buildx
        if: steps.gate.outputs.rebuild == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.gate.outputs.rebuild == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.gate.outputs.rebuild == 'true'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish standard image
        if: steps.gate.outputs.rebuild == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:${{ steps.release.outputs.build }}
            ${{ env.DOCKERHUB_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:${{ steps.release.outputs.build }}
            ${{ env.GHCR_IMAGE }}:latest
          cache-from: type=gha,scope=standard
          cache-to: type=gha,mode=max,scope=standard
          provenance: mode=max
          sbom: true
